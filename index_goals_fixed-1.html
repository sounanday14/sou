<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json"><title>勉強・生活時間管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{color:white;background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:18px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 12px}.exam{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exam div{background:#ffffff1c;border-radius:12px;padding:9px}.exam b{font-size:21px;display:block}main{max-width:760px;margin:auto;padding:12px 12px 82px}.card{background:white;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 3px 15px #25304a0d}h2{font-size:18px;margin:3px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid #e6e9f0;border-radius:13px;padding:11px}.stat small{color:#687386}.stat strong{display:block;font-size:19px;margin-top:4px}button,input,textarea{font:inherit}button{cursor:pointer}.primary{border:0;border-radius:11px;padding:11px 15px;background:#4f46e5;color:white;font-weight:700}.secondary{border:0;border-radius:11px;padding:10px 14px;background:#eef0ff;color:#4f46e5;font-weight:700}.danger{border:0;border-radius:9px;padding:8px 10px;background:#fff0f0;color:#dc2626}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #d9deea;border-radius:10px;background:white}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.subject{display:flex;align-items:center;gap:8px;margin:8px 0}.subject input{max-width:145px}.progress{height:8px;background:#e9ecf3;border-radius:99px;overflow:hidden;margin:6px 0 11px}.bar{height:100%;background:#4f46e5}.hidden{display:none}.muted{color:#687386}.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #e6e9f0}.monthhead{display:flex;align-items:center;justify-content:space-between}.monthhead button,.tabs button{border:0;background:#eef0ff;color:#4f46e5;border-radius:9px;padding:8px 11px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#687386;font-size:11px;padding:4px}.day{min-height:57px;border:1px solid #e6e9f0;background:white;border-radius:8px;text-align:left;padding:4px;font-size:12px}.day.out{opacity:.35}.day.sel{outline:2px solid #4f46e5}.day.today{background:#eef0ff}.mins{font-size:10px;color:#4f46e5;font-weight:700}.tabs{display:flex;gap:7px}.tabs button{flex:1;background:white;border:1px solid #e6e9f0}.tabs .active{background:#eef0ff;border-color:#cfd3ff;font-weight:700}canvas{width:100%;height:290px;border:1px solid #e6e9f0;border-radius:12px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e6e9f0;display:flex;z-index:10}nav button{flex:1;border:0;background:none;color:#687386;padding:9px 2px;font-size:10px}nav button.active{color:#4f46e5;font-weight:700}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>📚 勉強・生活時間管理</h1><div class="exam"><div><small>共テまで</small><b id="center">---</b>日</div><div><small>一般選抜まで</small><b id="general">---</b>日</div></div></header><main>
<section id="home"><div class="card"><h2>🎯 全期間の勉強目標</h2><div class="grid"><div class="stat"><small>現在</small><strong id="all">0時間</strong></div><div class="stat"><small>目標まであと</small><strong id="remain">未設定</strong></div><div class="stat"><small>目標</small><strong id="goal">0時間</strong></div><div class="stat"><small>達成率</small><strong id="rate">0%</strong></div></div></div><div class="card"><h2>📆 今週・今月</h2><div class="grid"><div class="stat"><small>今週</small><strong id="wt">0時間</strong></div><div class="stat"><small>週目標</small><strong id="wr">未設定</strong></div><div class="stat"><small>今月</small><strong id="mt">0時間</strong></div><div class="stat"><small>月目標</small><strong id="mr">未設定</strong></div></div></div><div class="card"><h2>📚 教科別進捗</h2><div id="progress"></div></div><div class="card"><h2>🕐 今日</h2><div id="today"></div><p id="comment" class="muted"></p></div></section>
<section id="input" class="hidden"><div class="card"><h2>✏️ 時間入力</h2><label>日付<input id="date" type="date" min="2026-10-01" max="2028-03-31"></label><h3>勉強時間（分）</h3><div id="si"></div><h3>勉強以外の時間（分）</h3><div id="li"></div><label>コメント<textarea id="com" placeholder="今日できたこと、反省、明日の目標など"></textarea></label><button class="primary" onclick="saveInput()">保存</button></div></section>
<section id="calendar" class="hidden"><div class="card"><div class="monthhead"><button onclick="mv(-1)">‹</button><h2 id="mh"></h2><button onclick="mv(1)">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="cal" id="cal"></div></div><div class="card"><h2 id="et"></h2><div id="ei"></div><button class="primary" onclick="saveEdit()">保存</button></div></section>
<section id="chart" class="hidden"><div class="card"><h2>📊 教科別・棒グラフ</h2><div class="tabs"><button id="wb" class="active" onclick="chart('week')">週ごと</button><button id="mb" onclick="chart('month')">月ごと</button></div><p class="muted">教科ごとの勉強時間を積み上げ表示します。</p><canvas id="cv" width="760" height="330"></canvas></div></section>
<section id="goals" class="hidden"><div class="card"><h2>🎯 目標設定</h2><label>全期間の合計目標（時間）<input id="og" type="number" min="0"></label><div id="sg"></div><button class="primary" onclick="saveGoals()">保存</button></div><div class="card"><h2>📅 週・月の目標</h2><label>週目標（自由記入）<input id="wg" type="text" placeholder="例：毎日2時間勉強する"></label><label>月目標（自由記入）<input id="mg" type="text" placeholder="例：数学を30ページ進める"></label><button class="secondary" onclick="savePeriod()">週・月目標を保存</button></div></section>
<section id="manage" class="hidden"><div class="card"><h2>📚 教科の追加・削除</h2><div id="sl"></div><div class="row"><input id="ns" placeholder="教科名"><button class="primary" onclick="addSub()">追加</button></div></div><div class="card"><h2>🕐 勉強以外の項目</h2><div id="ll"></div><div class="row"><input id="nl" placeholder="例：睡眠・趣味・部活"><button class="primary" onclick="addLife()">追加</button></div></div></section></main>
<nav><button class="active" onclick="show('home',this)">🏠<br>ホーム</button><button onclick="show('input',this)">✏️<br>入力</button><button onclick="show('calendar',this)">📅<br>カレンダー</button><button onclick="show('chart',this)">📊<br>グラフ</button><button onclick="show('goals',this)">🎯<br>目標</button><button onclick="show('manage',this)">⚙️<br>管理</button></nav>
<script>
const S='2026-10-01',E='2028-03-31',CT='2028-01-15',GT='2028-02-15';const pad=n=>String(n).padStart(2,'0'),dateKey=d=>{d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};let subs=JSON.parse(localStorage.getItem('subs')||'["国語","数学","英語","理科","社会","その他"]'),life=JSON.parse(localStorage.getItem('life')||'["睡眠","趣味","部活","その他"]'),D=JSON.parse(localStorage.getItem('D')||'{}'),G=JSON.parse(localStorage.getItem('G')||'{}'),sel=dateKey(new Date()),vd=new Date('2026-10-01'),mode='week';
const esc=s=>s.replace(/[^a-zA-Z0-9_-]/g,'_'),R=d=>d>=S&&d<=E,rec=d=>D[d]||(D[d]={s:{},l:{},c:''}),sm=(d,s)=>+(rec(d).s[s]||0),lm=(d,s)=>+(rec(d).l[s]||0),st=d=>subs.reduce((a,s)=>a+sm(d,s),0),fmt=m=>{m=Math.round(m);let h=Math.floor(m/60),x=m%60;return h?(h+'時間'+(x?' '+x+'分':'')):m+'分'},all=()=>Object.keys(D).reduce((a,d)=>a+st(d),0),save=()=>{localStorage.setItem('D',JSON.stringify(D));localStorage.setItem('subs',JSON.stringify(subs));localStorage.setItem('life',JSON.stringify(life))};
function diff(t){let n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.ceil((new Date(t)-n)/86400000))}function mon(x){x=new Date(x);let k=x.getDay()||7;x.setDate(x.getDate()-k+1);x.setHours(0,0,0,0);return x}function rng(a,b){let z=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))z+=st(dateKey(d));return z}
function show(id,b){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){center.textContent=diff(CT);general.textContent=diff(GT);let a=all(),t=(+G.overall||0)*60;document.getElementById('all').textContent=fmt(a);document.getElementById('goal').textContent=fmt(t);document.getElementById('remain').textContent=t?fmt(Math.max(0,t-a)):'未設定';document.getElementById('rate').textContent=t?Math.min(100,a/t*100).toFixed(1)+'%':'0%';let n=new Date(),w1=mon(n),w2=new Date(w1);w2.setDate(w2.getDate()+6);let m1=new Date(n.getFullYear(),n.getMonth(),1),m2=new Date(n.getFullYear(),n.getMonth()+1,0),w=rng(w1,w2),m=rng(m1,m2);wt.textContent=fmt(w);mt.textContent=fmt(m);wr.textContent=G.week||'未設定';mr.textContent=G.month||'未設定';progress.innerHTML=subs.map(s=>{let x=Object.values(D).reduce((a,d)=>a+(d.s?.[s]||0),0),g=(G[s]||0)*60,p=g?Math.min(100,x/g*100):0;return `<b>${s}</b> <span class="muted">${fmt(x)}${g?' / '+fmt(g):''}</span><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}).join('')||'教科を追加してください。';let td=dateKey(new Date());today.innerHTML=subs.filter(s=>sm(td,s)).map(s=>`<span>${s} ${fmt(sm(td,s))}</span>`).join('、')||'勉強時間なし';comment.textContent=rec(td).c?'💬 '+rec(td).c:'コメントはありません。';inputRender();calRender();editRender();goalRender();manageRender();draw()}
function inputRender(){date.value=sel;si.innerHTML=subs.map(s=>`<div class="subject"><b>${s}</b><input id="s_${esc(s)}" type="number" min="0" value="${sm(sel,s)}">分</div>`).join('');li.innerHTML=life.map(s=>`<div class="subject"><b>${s}</b><input id="l_${esc(s)}" type="number" min="0" value="${lm(sel,s)}">分</div>`).join('');com.value=rec(sel).c||'';date.onchange=()=>{sel=date.value;inputRender()}}
function saveInput(){if(!R(sel))return alert('対象期間外です');let r=rec(sel);r.s={};subs.forEach(s=>r.s[s]=+document.getElementById('s_'+esc(s)).value||0);r.l={};life.forEach(s=>r.l[s]=+document.getElementById('l_'+esc(s)).value||0);r.c=com.value.trim();save();render();alert('保存しました')}
function calRender(){let y=vd.getFullYear(),m=vd.getMonth();mh.textContent=`${y}年${m+1}月`;let f=new Date(y,m,1),q=new Date(y,m,1-f.getDay()),o='';for(let i=0;i<42;i++){let d=new Date(q);d.setDate(q.getDate()+i);let x=dateKey(d);o+=`<button class="day ${d.getMonth()!=m?'out ':''}${x==sel?'sel ':''}${x==dateKey(new Date())?'today':''}" onclick="pick('${x}')">${d.getDate()}<div class="mins">${R(x)&&st(x)?fmt(st(x)):''}</div></button>`}cal.innerHTML=o}function mv(n){vd.setMonth(vd.getMonth()+n);calRender()}function pick(x){if(R(x)){sel=x;calRender();editRender()}}
function editRender(){et.textContent=sel+' の記録';ei.innerHTML='<h3>勉強</h3>'+subs.map(s=>`<div class="subject"><b>${s}</b><input id="es_${esc(s)}" type="number" min="0" value="${sm(sel,s)}">分</div>`).join('')+'<h3>勉強以外</h3>'+life.map(s=>`<div class="subject"><b>${s}</b><input id="el_${esc(s)}" type="number" min="0" value="${lm(sel,s)}">分</div>`).join('')+`<label>コメント<textarea id="ec">${rec(sel).c||''}</textarea></label>`}function saveEdit(){let r=rec(sel);r.s={};subs.forEach(s=>r.s[s]=+document.getElementById('es_'+esc(s)).value||0);r.l={};life.forEach(s=>r.l[s]=+document.getElementById('el_'+esc(s)).value||0);r.c=document.getElementById('ec').value.trim();save();render();alert('保存しました')}
function chart(x){mode=x;wb.classList.toggle('active',x=='week');mb.classList.toggle('active',x=='month');draw()}function draw(){let c=cv,ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let L=[],V=[];if(mode=='week'){let z=mon(new Date());for(let i=0;i<12;i++){let a=new Date(z);a.setDate(a.getDate()-77+7*i);let b=new Date(a);b.setDate(b.getDate()+6);L.push(`${a.getMonth()+1}/${a.getDate()}`);V.push(subs.map(s=>{let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))n+=sm(dateKey(d),s);return n/60}))}}else{let n=new Date();n.setDate(1);for(let i=0;i<12;i++){let a=new Date(n.getFullYear(),n.getMonth()-11+i,1),b=new Date(n.getFullYear(),n.getMonth()-10+i,0);L.push(`${a.getFullYear()}/${a.getMonth()+1}`);V.push(subs.map(s=>{let q=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))q+=sm(dateKey(d),s);return q/60}))}}let max=Math.max(1,...V.map(v=>v.reduce((a,b)=>a+b,0))),left=42,bottom=38,pw=w-left-10,ph=h-bottom-15,bw=pw/L.length*.68;ctx.strokeStyle='#dfe3ec';ctx.beginPath();ctx.moveTo(left,15);ctx.lineTo(left,h-bottom);ctx.lineTo(w-8,h-bottom);ctx.stroke();V.forEach((v,i)=>{let x=left+(i+.5)*pw/L.length-bw/2,y=h-bottom;v.forEach((n,j)=>{let bh=n/max*ph;ctx.fillStyle=`hsl(${235+j*360/Math.max(1,subs.length)},70%,55%)`;ctx.fillRect(x,y-bh,bw,bh);y-=bh});ctx.fillStyle='#687386';ctx.font='11px sans-serif';ctx.fillText(L[i],x,h-20)})}
function goalRender(){og.value=G.overall||0;wg.value=G.week||'';mg.value=G.month||'';sg.innerHTML=subs.map(s=>`<label>${s}<input id="g_${esc(s)}" type="number" min="0" value="${G[s]||0}"></label>`).join('')}function saveGoals(){G.overall=+og.value||0;subs.forEach(s=>G[s]=+document.getElementById('g_'+esc(s)).value||0);localStorage.setItem('G',JSON.stringify(G));render();alert('保存しました')}function savePeriod(){G.week=wg.value.trim();G.month=mg.value.trim();localStorage.setItem('G',JSON.stringify(G));render();alert('保存しました')}
function manageRender(){sl.innerHTML=subs.map(s=>`<div class="item"><b>${s}</b><button class="danger" onclick="delSub('${s.replaceAll("'","\\'")}')">削除</button></div>`).join('');ll.innerHTML=life.map(s=>`<div class="item"><b>${s}</b><button class="danger" onclick="delLife('${s.replaceAll("'","\\'")}')">削除</button></div>`).join('')}function addSub(){let x=ns.value.trim();if(x&&!subs.includes(x)){subs.push(x);ns.value='';save();render()}}function delSub(x){if(subs.length>1&&confirm(x+'を削除しますか？')){subs=subs.filter(s=>s!=x);save();render()}}function addLife(){let x=nl.value.trim();if(x&&!life.includes(x)){life.push(x);nl.value='';save();render()}}function delLife(x){if(life.length>1&&confirm(x+'を削除しますか？')){life=life.filter(s=>s!=x);save();render()}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
